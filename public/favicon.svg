<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EdgeList">
	<!-- The same mark as the wordmark's tile, at 16px: an accent square with a
	     quarter-of-the-tile radius, and an E drawn as bars rather than set in a
	     typeface, because a favicon cannot count on a font being there. The fill
	     is `--accent` from `index.css` converted to sRGB, since a theme token
	     cannot cross into a standalone file. -->
	<rect width="32" height="32" rx="8" fill="#0485f7" />
	<g fill="#fcfcfc">
		<rect x="10" y="8" width="2.5" height="16" />
		<rect x="10" y="8" width="13" height="2.5" />
		<rect x="10" y="14.75" width="10" height="2.5" />
		<rect x="10" y="21.5" width="13" height="2.5" />
	</g>
</svg>
